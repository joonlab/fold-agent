<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1600,h=900,scale=2">
<title>폴드 에이전트 썸네일</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<link rel="stylesheet" href="_app.css">
<style>
  .lefty { position:absolute; left:96px; top:0; bottom:0; width:700px; display:flex; flex-direction:column; justify-content:center; gap:18px; color:var(--mac-text); }
  .lefty .app-icon { width:96px; height:96px; border-radius:22px; }
  .lefty h1 { margin:0; font-size:72px; line-height:80px; letter-spacing:-1.5px; }
  .lefty .one { font-size:30px; line-height:40px; font-weight:700; }
  .lefty .sub { font-size:19px; line-height:30px; color:var(--mac-dim); }
  .chips2 { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .r { position:absolute; right:120px; top:0; bottom:0; display:flex; align-items:center; }
</style>
</head><body>
<div class="canvas thumb app-foldagent desk-accent">
  <div class="lefty">
    <img class="app-icon" data-app="foldagent" alt="">
    <h1>폴드 에이전트</h1>
    <div class="one">말하면 폰이 앱을 열고 누르고 답한다</div>
    <div class="sub">접근성 + 온디바이스 음성 인식 + LLM 도구 루프.<br>되돌릴 수 없는 동작은 늘 먼저 묻습니다.</div>
    <div class="chips2"><span class="tag accent">Android 앱</span><span class="tag accent">확인 게이트</span><span class="tag accent">재계획</span><span class="tag accent">Claude Code 위임</span><span class="tag accent">사람 개입</span></div>
  </div>
  <div class="r">
    <div class="fold-cover" style="--zoom:1">
      <div class="screen">
        <div class="status-bar" data-time="7:42"></div>
        <div class="fake-app dim-app" style="top:32px">
          <div class="fa-head"><i data-icon="arrow-left"></i>배터리</div>
          <div class="fa-big">93%</div>
          <div class="fa-row"><div class="s">남은 시간 약 1일 4시간</div></div>
          <div class="fa-row"><div class="t">절전 모드</div><div class="s">꺼짐</div></div>
          <div class="fa-row"><div class="t">배터리 보호</div><div class="s">최대 85%</div></div>
        </div>
        <div class="edge-glow"></div>
        <div class="overlay-panel run-panel" style="bottom:40px">
          <div class="rp-head"><img data-app="foldagent" alt=""><span>폴드 에이전트 · 2단계 · 7초</span></div>
          <div class="row"><span class="pulse"></span><span class="rp-line">배터리는 93%예요</span></div>
          <div class="rp-btns"><span class="btn"><i data-icon="stop"></i>읽기 멈춤</span><span class="btn"><i data-icon="message"></i>대화방</span></div>
        </div>
        <div class="nav-handle"></div>
      </div>
    </div>
  </div>
</div>
</body></html>
