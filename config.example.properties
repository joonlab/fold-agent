# 폴드 에이전트 빌드 설정 예시
# 이 파일을 참고해 루트의 local.properties 에 필요한 줄만 옮겨 적는다(local.properties 는 git 에 올라가지 않는다).
# 같은 키를 gradle 속성(-Pfoldagent.llmBase=...)이나 환경변수(FOLDAGENT_LLM_BASE)로 줘도 된다. 우선순위: 속성 > 환경변수 > local.properties > 기본값.
# 토큰·API 키는 여기에 적지 않는다 — 앱 설정 화면에서 입력한다(폰 SharedPreferences 에만 저장).

# Android SDK 위치(Android Studio 가 알아서 채워 주는 줄)
sdk.dir=/path/to/Android/sdk

# ── LLM ────────────────────────────────────────────────
# OpenAI 호환 /v1 주소. 기본은 OpenAI 공식 API. 사설망의 프록시를 쓰면 그 주소(https)
foldagent.llmBase=https://api.openai.com/v1
# 화면 조작 루프에 쓰는 모델
foldagent.model=gpt-5.6-sol
# 막혔을 때 다시 계획하는 모델과, 30초 안에 답이 없을 때 쓰는 대체 모델
foldagent.replanModel=gpt-6-astra
foldagent.replanFallback=gpt-6-sol
# web_search·read_url·image_gen 직접 도구가 /v1/responses 에 쓰는 모델
foldagent.oaiToolModel=gpt-5.5

# ── 홈 서버(선택) ───────────────────────────────────────
# 비서 도구·스킬 게이트웨이·Claude Code 위임을 받아 줄 서버. 계약서 docs/server-contract/CONTRACT.md
# 비워 두면 이 도구들은 「연결 설정 없음」으로 실패하고, 화면 조작·기기 도구는 그대로 쓴다
foldagent.assistantBase=https://<home-server-host>/api/phone
# 디버그 인텐트(--es assistantBase)로 주소를 바꿀 때 믿을 호스트 접미사. 비우면 위 주소와 같은 호스트만
foldagent.trustedHostSuffix=
# 메일 확인 창에 보여 줄 발신 주소(서버가 실제로 쓰는 주소와 맞춘다)
foldagent.mailFrom=assistant@example.com
